<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0b0b0b">RibAssist 3D — biplanar 3D rib-fracture reconstruction pipeline</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8c959f"/></marker>
    <style>
      .box{rx:9; stroke-width:1.6;}
      .data{fill:#eaf1fb; stroke:#2a78d6;}
      .proc{fill:#f6f8fa; stroke:#c4cbd3;}
      .out{fill:#fdece3; stroke:#eb6834;}
      .t{font-size:13.5px; font-weight:700; fill:#0b0b0b; text-anchor:middle;}
      .s{font-size:11px; fill:#52514e; text-anchor:middle;}
    </style>
  </defs>

  <!-- arrows (behind boxes) -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="168" y1="150" x2="180" y2="150" marker-end="url(#a)"/>
    <line x1="336" y1="150" x2="348" y2="150" marker-end="url(#a)"/>
    <line x1="504" y1="150" x2="516" y2="150" marker-end="url(#a)"/>
    <line x1="672" y1="150" x2="684" y2="150" marker-end="url(#a)"/>
    <line x1="840" y1="150" x2="852" y2="150" marker-end="url(#a)"/>
    <line x1="1008" y1="150" x2="1020" y2="150" marker-end="url(#a)"/>
  </g>

  <!-- boxes -->
  <rect class="box data" x="18" y="100" width="150" height="100" rx="9"/>
  <text class="t" x="93" y="140">CT volume</text>
  <text class="s" x="93" y="160">annotated fractures</text>
  <text class="s" x="93" y="176">+ rib segmentation</text>

  <rect class="box proc" x="186" y="100" width="150" height="100" rx="9"/>
  <text class="t" x="261" y="135">Orthographic</text>
  <text class="t" x="261" y="152">projection</text>
  <text class="s" x="261" y="172">AP + lateral views</text>

  <rect class="box proc" x="354" y="100" width="150" height="100" rx="9"/>
  <text class="t" x="429" y="135">Per-view U-Net</text>
  <text class="t" x="429" y="152">detector  ×2</text>
  <text class="s" x="429" y="172">fracture heatmaps</text>

  <rect class="box proc" x="522" y="100" width="150" height="100" rx="9"/>
  <text class="t" x="597" y="135">Peak</text>
  <text class="t" x="597" y="152">extraction  ×2</text>
  <text class="s" x="597" y="172">NMS + score floor</text>

  <rect class="box proc" x="690" y="100" width="150" height="100" rx="9"/>
  <text class="t" x="765" y="135">Candidate pair</text>
  <text class="t" x="765" y="152">graph</text>
  <text class="s" x="765" y="172">SI gate |ΔSI| ≤ gate</text>

  <rect class="box proc" x="858" y="100" width="150" height="100" rx="9"/>
  <text class="t" x="933" y="135">Assignment with</text>
  <text class="t" x="933" y="152">abstention</text>
  <text class="s" x="933" y="172">commit if cost &lt; 2u</text>

  <rect class="box out" x="1026" y="100" width="150" height="100" rx="9"/>
  <text class="t" x="1101" y="135">Triangulate</text>
  <text class="t" x="1101" y="152">→ 3D points</text>
  <text class="s" x="1101" y="172">back-projection</text>

  <!-- stage tags under boxes -->
  <text x="429" y="228" text-anchor="middle" font-size="11" fill="#8c959f">frozen detector (AP + L2-retrained lateral)</text>
  <text x="765" y="228" text-anchor="middle" font-size="11" fill="#8c959f">Stage D0</text>
  <text x="933" y="228" text-anchor="middle" font-size="11" fill="#8c959f">Stage D1 (frozen policy)</text>
  <text x="1101" y="228" text-anchor="middle" font-size="11" fill="#8c959f">Stages A–B geometry</text>

  <!-- bottleneck callout on the assignment box -->
  <rect x="770" y="262" width="330" height="66" rx="8" fill="#fff8f4" stroke="#eb6834" stroke-width="1.4"/>
  <text x="935" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#eb6834">The operational bottleneck</text>
  <text x="935" y="305" text-anchor="middle" font-size="11.5" fill="#52514e">commits only pairs the detector is confident about;</text>
  <text x="935" y="321" text-anchor="middle" font-size="11.5" fill="#52514e">low-confidence correct pairs are abstained (no 3D point).</text>
  <line x1="935" y1="200" x2="935" y2="262" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="3,3"/>
</svg>
