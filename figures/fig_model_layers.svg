<rect x="55" y="150" width="150" height="72" rx="8" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.6"/>
<text x="130.0" y="170" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">inc</text>
<text x="130.0" y="186" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">DConv 1&#8594;32</text>
<text x="130.0" y="200" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">32 &#215; 256&#178;</text>
<text x="130.0" y="212" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">9.7k</text>
<rect x="170" y="236" width="150" height="72" rx="8" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.6"/>
<text x="245.0" y="256" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">d1</text>
<text x="245.0" y="272" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">DConv 32&#8594;64</text>
<text x="245.0" y="286" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">64 &#215; 128&#178;</text>
<text x="245.0" y="298" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">55.7k</text>
<rect x="285" y="322" width="150" height="72" rx="8" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.6"/>
<text x="360.0" y="342" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">d2</text>
<text x="360.0" y="358" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">DConv 64&#8594;128</text>
<text x="360.0" y="372" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">128 &#215; 64&#178;</text>
<text x="360.0" y="384" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">222k</text>
<rect x="470" y="408" width="190" height="72" rx="8" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.6"/>
<text x="565.0" y="428" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">d3 (bottleneck)</text>
<text x="565.0" y="444" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">DConv 128&#8594;256</text>
<text x="565.0" y="458" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">256 &#215; 32&#178;</text>
<text x="565.0" y="470" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">886k</text>
<rect x="700" y="322" width="150" height="72" rx="8" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.6"/>
<text x="775.0" y="342" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">u3</text>
<text x="775.0" y="358" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">DConv 384&#8594;128</text>
<text x="775.0" y="372" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">128 &#215; 64&#178;</text>
<text x="775.0" y="384" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">591k</text>
<rect x="815" y="236" width="150" height="72" rx="8" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.6"/>
<text x="890.0" y="256" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">u2</text>
<text x="890.0" y="272" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">DConv 192&#8594;64</text>
<text x="890.0" y="286" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">64 &#215; 128&#178;</text>
<text x="890.0" y="298" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">148k</text>
<rect x="900" y="150" width="140" height="72" rx="8" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.6"/>
<text x="970.0" y="170" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">u1</text>
<text x="970.0" y="186" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">DConv 96&#8594;32</text>
<text x="970.0" y="200" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">32 &#215; 256&#178;</text>
<text x="970.0" y="212" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">37k</text>
<rect x="1050" y="150" width="150" height="72" rx="8" fill="#fdece3" stroke="#eb6834" stroke-width="1.6"/>
<text x="1125.0" y="170" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">outc</text>
<text x="1125.0" y="186" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">Conv 1&#215;1 32&#8594;1</text>
<text x="1125.0" y="200" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">1 &#215; 256&#178;</text>
<text x="1125.0" y="212" font-size="10.5" font-weight="400" fill="#8c959f" text-anchor="middle">33</text>
<rect x="470" y="150" width="210" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="575" y="170" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">DConv(a&#8594;b) =</text>
<text x="575" y="186" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">[Conv 3&#215;3 (pad 1), BN, ReLU]</text>
<text x="575" y="200" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">&#215; 2</text>
<text x="40" y="500" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Total 1,949,121 params per view. Deployed as two independent U-Nets (AP + lateral, ~3.9M); the L2-retrained lateral head is the same shape.</text>
<text x="40" y="517" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Down path: 2&#215;2 maxpool between stages. Up path: bilinear upsample &#215;2 to the skip resolution, then concatenate the skip channels.</text>
<line x1="40" y1="531" x2="1180" y2="531" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="40" y="560" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">2 &#183; Addressing network  (rib-level assignment &#183; 48.8k params)</text>
<rect x="40" y="585" width="120" height="40" rx="7" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="100.0" y="603.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">AP proj</text>
<text x="100.0" y="618.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">1 &#215; 256&#178;</text>
<rect x="185" y="585" width="105" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="237.5" y="603.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Conv 1&#8594;16 &#8595;</text>
<text x="237.5" y="618.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">BN&#183;ReLU&#183;pool &#183; 128&#178;</text>
<line x1="163" y1="605" x2="185" y2="605" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
