<line x1="245.0" y1="308" x2="360.0" y2="322" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="360.0" y1="394" x2="565.0" y2="408" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
