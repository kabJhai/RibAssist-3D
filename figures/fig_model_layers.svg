<text x="491.5" y="603.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Conv 32&#8594;64 &#8595;</text>
<text x="491.5" y="618.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">BN&#183;ReLU&#183;pool &#183; 32&#178;</text>
<line x1="417" y1="605" x2="439" y2="605" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="566" y="585" width="90" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="611.0" y="603.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">GAP</text>
<text x="611.0" y="618.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">&#8594; 64-d</text>
<line x1="544" y1="605" x2="566" y2="605" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="645" width="120" height="40" rx="7" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="100.0" y="663.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">lateral proj</text>
<text x="100.0" y="678.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">1 &#215; 256&#178;</text>
<rect x="185" y="645" width="105" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="237.5" y="663.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Conv 1&#8594;16 &#8595;</text>
<text x="237.5" y="678.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">BN&#183;ReLU&#183;pool &#183; 128&#178;</text>
<line x1="163" y1="665" x2="185" y2="665" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="312" y="645" width="105" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="364.5" y="663.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Conv 16&#8594;32 &#8595;</text>
<text x="364.5" y="678.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">BN&#183;ReLU&#183;pool &#183; 64&#178;</text>
<line x1="290" y1="665" x2="312" y2="665" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="439" y="645" width="105" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="491.5" y="663.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Conv 32&#8594;64 &#8595;</text>
<text x="491.5" y="678.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">BN&#183;ReLU&#183;pool &#183; 32&#178;</text>
<line x1="417" y1="665" x2="439" y2="665" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="566" y="645" width="90" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="611.0" y="663.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">GAP</text>
<text x="611.0" y="678.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">&#8594; 64-d</text>
<line x1="544" y1="665" x2="566" y2="665" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="696" y="615" width="95" height="40" rx="7" fill="#eef1f4" stroke="#8c959f" stroke-width="1.4"/>
<text x="743.5" y="633.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">concat</text>
<text x="743.5" y="648.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">&#8594; 128-d</text>
<line x1="656" y1="605" x2="696" y2="635" stroke="#8c959f" stroke-width="1.4"/>
<line x1="656" y1="665" x2="696" y2="635" stroke="#8c959f" stroke-width="1.4"/>
<rect x="821" y="585" width="220" height="26" rx="7" fill="#fdece3" stroke="#eb6834" stroke-width="1.4"/>
<text x="931.0" y="602.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">side head: Linear 128&#8594;1 (sigmoid)</text>
<line x1="791" y1="635" x2="821" y2="598" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="821" y="615" width="220" height="26" rx="7" fill="#fdece3" stroke="#eb6834" stroke-width="1.4"/>
<text x="931.0" y="632.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">rib head: Linear 128&#8594;12 (softmax)</text>
<line x1="791" y1="635" x2="821" y2="628" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="821" y="645" width="220" height="26" rx="7" fill="#fdece3" stroke="#eb6834" stroke-width="1.4"/>
<text x="931.0" y="662.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">addr. head: Linear 128&#8594;1 (sigmoid)</text>
<line x1="791" y1="635" x2="821" y2="658" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="705" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Two identical CNN streams &#8594; 64-d each &#8594; concat 128-d &#8594; three linear heads. Reported address_score = side confidence &#215; rib probability. Runs on the RAW projections.</text>
<line x1="40" y1="725" x2="1180" y2="725" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="40" y="757" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">3 &#183; Learned pair-scorer  (cross-view correspondence, D2b &#183; 12.6k params)</text>
<rect x="40" y="782" width="110" height="40" rx="7" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="95.0" y="800.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">AP crop</text>
<text x="95.0" y="815.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">1 &#215; 40&#178;</text>
<rect x="40" y="834" width="110" height="40" rx="7" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="95.0" y="852.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">lateral crop</text>
<text x="95.0" y="867.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">1 &#215; 40&#178;</text>
<rect x="200" y="808" width="250" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="325.0" y="826.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">shared tower</text>
<text x="325.0" y="841.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">Conv&#8595;16 &#183; Conv&#8595;32 &#183; GAP &#183; FC&#8594;32</text>
<line x1="152" y1="802" x2="200" y2="822" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="152" y1="854" x2="200" y2="822" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<text x="325" y="864" font-size="9.5" font-weight="400" fill="#8c959f" text-anchor="middle">&#8594; ea, el (32-d each)</text>
<rect x="485" y="798" width="250" height="40" rx="7" fill="#eef1f4" stroke="#8c959f" stroke-width="1.4"/>
<text x="610.0" y="816.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">combine</text>
<text x="610.0" y="831.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">[ea, el, ea&#215;el] + 6 scalars &#8594; 102-d</text>
<line x1="450" y1="828" x2="485" y2="818" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="765" y="798" width="200" height="40" rx="7" fill="#f6f8fa" stroke="#c4cbd3" stroke-width="1.4"/>
<text x="865.0" y="816.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">MLP head</text>
<text x="865.0" y="831.0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">102&#8594;64, ReLU, drop 0.4, 64&#8594;1</text>
<line x1="735" y1="818" x2="765" y2="818" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="765" y="848" width="200" height="26" rx="7" fill="#fdece3" stroke="#eb6834" stroke-width="1.4"/>
<text x="865.0" y="865.0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">pair score</text>
<line x1="865" y1="838" x2="865" y2="848" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="894" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">6 scalars = normalized |&#916;SI|, AP score, lateral score, and the min / product / asymmetry of the two confidences. Does not beat detector confidence at the operational budget.</text>
</svg>