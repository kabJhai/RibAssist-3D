<text x="150" y="120" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">Input: AP or lateral projection &#183; 1 &#215; 256&#178;</text>
<line x1="205" y1="186.0" x2="900" y2="186.0" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="552.5" y="180.0" font-size="9.5" font-weight="400" fill="#2a78d6" text-anchor="middle">skip (concat)</text>
