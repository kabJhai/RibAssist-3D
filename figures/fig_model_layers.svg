<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 900" font-family="Helvetica, Arial, sans-serif">
<rect width="1220" height="900" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8c959f"/></marker></defs>
<text x="610.0" y="38" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">RibAssist 3D &#8212; model architecture, layer by layer</text>
<text x="40" y="80" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">1 &#183; Per-view detector U-Net  (base channels = 32; one independent copy per view)</text>
