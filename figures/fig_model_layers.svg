<text x="567.5" y="266.0" font-size="9.5" font-weight="400" fill="#2a78d6" text-anchor="middle">skip (concat)</text>
<line x1="435" y1="358.0" x2="700" y2="358.0" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="567.5" y="352.0" font-size="9.5" font-weight="400" fill="#2a78d6" text-anchor="middle">skip (concat)</text>
