<text x="104" y="272" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">Tested correspondence methods</text>
<text x="104" y="296" font-size="15" font-weight="normal" fill="#555555" text-anchor="start">D1 and D2: 0% recall@10 at &lt;=1 false/case on frozen detections.</text>
<text x="1066" y="284.0" font-size="15" font-weight="normal" fill="#555555" text-anchor="end">not the effective lever</text>
