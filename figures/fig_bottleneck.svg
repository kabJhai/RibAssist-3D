<text x="104" y="384" font-size="15" font-weight="normal" fill="#555555" text-anchor="start">L1 sweep: cleaner field, frontier still 0%.</text>
<text x="1066" y="372.0" font-size="15" font-weight="normal" fill="#555555" text-anchor="end">not sufficient</text>
<line x1="560.0" y1="404" x2="560.0" y2="418" stroke="#bdbdbd" stroke-width="1.6" marker-end="url(#arr)"/>
