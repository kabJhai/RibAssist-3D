<text x="560.0" y="548" font-size="18" font-weight="bold" fill="#3182bd" text-anchor="middle">Sealed test: commitment yield@10 2.50% (15/601) at 0.436 false-3D/case; CI 0.69%-4.48%</text>
<text x="560.0" y="570" font-size="15" font-weight="normal" fill="#555555" text-anchor="middle">55 cases, 601 fractures; policy frozen on development</text>
